services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskmanager_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fastapi_user", "-d", "taskmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fastapi_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/taskmanager_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fastapi_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/taskmanager_db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
