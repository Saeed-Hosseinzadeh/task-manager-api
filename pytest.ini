# -----------------------------------------------------------------------------
# Pytest Configuration
#
# This file defines the global configuration for the pytest testing framework.
# It standardizes how tests are discovered, executed, and reported across
# the project.
#
# The configuration ensures consistent test discovery, improved output
# readability, and proper support for asynchronous FastAPI tests.
# -----------------------------------------------------------------------------

[pytest]

# Add the project root directory to the Python module search path.
# This allows imports such as `from app...` to work during test execution.
pythonpath = .

# Directory where pytest will search for test files.
testpaths = tests

# Pattern used by pytest to discover test files.
# Only files matching this pattern will be treated as test modules.
python_files = test_*.py

# Pattern used by pytest to identify test functions inside test files.
python_functions = test_*

# Improve pytest output readability:
# -ra : show extra summary info for skipped/failed tests
# -vv : increase verbosity level
addopts = -ra -vv

# Enable automatic detection and execution of asynchronous tests.
# Required for frameworks such as FastAPI that rely on async endpoints.
asyncio_mode = auto
