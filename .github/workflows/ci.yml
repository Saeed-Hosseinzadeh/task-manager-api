name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [14, 15]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate a test-only JWT key
        run: printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run fast SQLite tests
        run: python -m pytest -m "not postgresql"

      - name: Run PostgreSQL integration tests against Alembic migrations
        run: python -m pytest -m postgresql

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image from checkout
        run: docker build --tag task-manager-ci .
      - name: Rebuild with build-context sentinels
        run: |
          printf '%s\n' 'Harmless build-context sentinel' | tee \
            app/.env.build-context-sentinel \
            app/core/build_context_sentinel.py \
            alembic/build-context-sentinel.sqlite \
            alembic/versions/build_context_sentinel.py
          docker build --tag task-manager-ci .
      - name: Check files and imports in the application image
        run: |
          docker run --rm -i --entrypoint python task-manager-ci - <<'PY'
          from pathlib import Path

          root = Path("/code")
          assert not any("sentinel" in path.name for path in root.rglob("*"))
          assert {path.name for path in root.iterdir()} == {"app", "alembic", "alembic.ini"}
          forbidden = {".git", ".venv", "__pycache__", ".pytest_cache", "htmlcov", "coverage.xml"}
          for path in root.rglob("*"):
              assert path.name not in forbidden, path
              assert not path.name.startswith((".env", ".coverage")), path
              assert path.suffix not in {".db", ".sqlite", ".sqlite3", ".pyc"}, path
          PY
          docker run --rm \
            -e DATABASE_URL=postgresql://buildcheck@127.0.0.1:1/buildcheck \
            -e SECRET_KEY=synthetic-build-check-placeholder-only \
            --entrypoint python task-manager-ci -c "from app.main import app; assert app.routes"
          docker run --rm --entrypoint python task-manager-ci -m alembic heads

      - name: Smoke-test Compose startup and migrations
        run: |
          umask 077
          printf 'SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" > .env
          trap 'docker compose down --volumes; rm -f .env' EXIT
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8000/health | python -c 'import json,sys; assert json.load(sys.stdin)["data"]["status"] == "ok"'
          docker compose exec -T web python -m alembic current | grep '(head)'
