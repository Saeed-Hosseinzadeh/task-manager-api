# ---------------------------------------------------------
# Alembic Configuration File
# ---------------------------------------------------------
#
# This configuration file defines how Alembic manages and
# executes database migrations for the application.
#
# Key Responsibilities
# --------------------
# - Specify the migration script location
# - Configure logging behavior
# - Define optional post-processing hooks for generated migrations
#
# Database Configuration
# ----------------------
# The database connection URL is intentionally left empty here.
# It is dynamically provided by the application's configuration
# inside `alembic/env.py` using the runtime settings.
#
# This approach ensures that migration commands always use the
# same database configuration as the application itself.
# ---------------------------------------------------------

[alembic]

# Location of the Alembic migration scripts directory.
script_location = %(here)s/alembic

# Ensures the project root is included in Python's module search path
# so Alembic can resolve application imports correctly.
prepend_sys_path = .

# Defines the path separator used by Alembic for file operations.
path_separator = os

# Database URL is intentionally left blank.
# The actual connection string is supplied dynamically
# from the application settings inside alembic/env.py.
sqlalchemy.url =


# ---------------------------------------------------------
# Post-write Hooks
# ---------------------------------------------------------
#
# Optional tooling that can automatically run after Alembic
# generates a new migration revision file.
#
# Common use cases include:
# - Auto-formatting migration scripts
# - Applying linting or static analysis
#
# The examples below are commented out but demonstrate how
# tools such as Ruff or Black could be integrated.
# ---------------------------------------------------------

[post_write_hooks]

# Example: Run Ruff to lint and auto-fix migration scripts
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Example: Format migration scripts with Black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------
#
# Defines the logging behavior for Alembic operations and
# SQLAlchemy engine interactions during migrations.
# ---------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


# Root logger configuration
[logger_root]
level = WARNING
handlers = console


# SQLAlchemy engine logging
# Typically set to WARNING to avoid verbose SQL output
# unless debugging database behavior.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


# Alembic migration logging
# INFO level provides useful feedback during migrations
# such as revision execution and script generation.
[logger_alembic]
level = INFO
handlers =
qualname = alembic


# Console log handler
# Outputs logs to stderr during migration commands.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# Log message format configuration
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
